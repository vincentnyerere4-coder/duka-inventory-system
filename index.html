<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIFFER COSMETIC SHOP</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#fff0f6}header{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:white;padding:20px;text-align:center}.container{max-width:980px;margin:16px auto;padding:0 12px;display:grid;gap:16px}@media(min-width:768px){.container{grid-template-columns:1fr 1fr}}.card{background:white;border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(236,72,153,.12);border:1px solid #fce7f3}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #f9a8d4;margin-top:8px;background:#fffafb}label{font-size:12px;font-weight:800;color:#be185d;margin-top:12px;display:block}.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;margin-top:12px;cursor:pointer}.btn-add{background:#ec4899;color:white}.btn-sell{background:#8b5cf6;color:white}.receipt{background:#1f1020;color:#fce7f3;border-radius:14px;padding:14px;font-family:monospace;white-space:pre-line;min-height:100px}.action-btn{display:block;padding:13px;text-align:center;border-radius:12px;text-decoration:none;font-weight:800;margin-top:10px;color:white}.sms{background:#2563eb}.wa{background:#16a34a}.email{background:#f59e0b;color:#000}
</style>
</head>
<body>
<header><h1>💄 NIFFER COSMETIC SHOP</h1><p>Beauty • Skincare • Perfume</p></header>
<div class="container">
<div>
<div class="card">
<h3 style="color:#be185d">1. Ongeza Bidhaa</h3>
<select id="pCat"><option>Lipstick</option><option>Foundation</option><option>Perfume</option><option>Skincare</option><option>Hair</option><option>Nails</option></select>
<input id="pName" placeholder="Jina: Matte Lipstick Pink">
<input id="pPrice" type="number" placeholder="Bei: 15000">
<input id="pQty" type="number" placeholder="Idadi: 20">
<button class="btn btn-add" onclick="addProduct()">Ongeza Dukani 💅</button>
</div>
<div class="card" style="margin-top:16px">
<h3 style="color:#7c3aed">2. Uza kwa Mteja</h3>
<label>Chagua Bidhaa</label><select id="sName"></select>
<input id="sQty" type="number" placeholder="Idadi: 2">
<label>Jina la Mteja</label><input id="cName" placeholder="Neema">
<label>Namba ya Simu</label><input id="cPhone" placeholder="0712345678">
<label>Email</label><input id="cEmail" placeholder="neema@gmail.com">
<button class="btn btn-sell" onclick="sellProduct()">Uza & Tuma Risiti ✨</button>
</div>
</div>
<div>
<div class="card"><h3>💖 Stock</h3><div id="stockList"></div><div style="margin-top:10px">Total: <b id="totalValue">0</b></div></div>
<div class="card" style="margin-top:16px"><h3>🧾 Risiti</h3><div id="receipt" class="receipt">Hakuna mauzo</div><div id="actionBox"></div></div>
</div>
</div>
<script>
let products=JSON.parse(localStorage.getItem('niffer')||'[]');
function save(){localStorage.setItem('niffer',JSON.stringify(products));render();}
function addProduct(){let cat=pCat.value,n=pName.value.trim(),p=parseFloat(pPrice.value),q=parseInt(pQty.value);if(!n||!p||!q)return alert('Jaza vyote');let e=products.find(x=>x.name.toLowerCase()===n.toLowerCase());if(e){e.qty+=q;e.price=p;e.cat=cat;}else products.push({name:n,price:p,qty:q,cat:cat});pName.value=pPrice.value=pQty.value='';save();}
function sellProduct(){let sel=document.getElementById('sName'),n=sel.value,q=parseInt(sQty.value),phone=cPhone.value.trim(),email=cEmail.value.trim(),cname=cName.value.trim()||'Mteja';if(!n)return alert('Ongeza bidhaa kwanza dukani');if(!q)return alert('Weka idadi');if(!phone)return alert('Weka namba');let prod=products.find(x=>x.name===n);if(prod.qty<q)return alert('Stock haitoshi: '+prod.qty);prod.qty-=q;let total=prod.price*q;let date=new Date().toLocaleString('sw-TZ');let text=`💄 NIFFER COSMETIC SHOP\nMteja: ${cname}\nTarehe: ${date}\nBidhaa: ${prod.name}\nIdadi: ${q}\nJUMLA: ${total} TZS\nAsante 💖`;document.getElementById('receipt').innerText=text;let enc=encodeURIComponent(text);let waPhone=phone.replace(/^0/,'255').replace(/\+/g,'');document.getElementById('actionBox').innerHTML=`<a class="action-btn sms" href="sms:${phone}?body=${enc}">📩 TUMA SMS</a><a class="action-btn wa" href="https://wa.me/${waPhone}?text=${enc}" target="_blank">💬 TUMA WhatsApp</a><a class="action-btn email" href="mailto:${email}?subject=Risiti Niffer&body=${enc}">📧 TUMA EMAIL</a>`;if(prod.qty===0)products=products.filter(x=>x!==prod);save();}
function render(){let list=document.getElementById('stockList'),sel=document.getElementById('sName');if(!products.length){list.innerHTML='<small>Hakuna bidhaa</small>';sel.innerHTML='<option value="">Hakuna bidhaa - ongeza kwanza</option>';}else{list.innerHTML=products.map(p=>`<div style="padding:8px 0;border-bottom:1px solid #fce7f3"><b>${p.name}</b> - ${p.price} TZS x ${p.qty}</div>`).join('');sel.innerHTML=products.map(p=>`<option value="${p.name}">${p.name} - ${p.qty} zipo</option>`).join('');}document.getElementById('totalValue').innerText=products.reduce((s,p)=>s+p.price*p.qty,0).toLocaleString()+' TZS';}
render();
</script>
</body>
</html>
